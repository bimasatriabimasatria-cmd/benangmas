<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keberhasilan Indexing - Benang Mas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1a2b4c; 
            --secondary-color: #d4af37;
            --bg-cotton: #fdfbf7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, #0d1627 100%);
            color: var(--bg-cotton);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Kanvas untuk efek confetti jatuh */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Desain kartu ucapan */
        .celebration-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            z-index: 2;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpFade 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes slideUpFade {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .icon-wrapper {
            width: 90px;
            height: 90px;
            background: var(--secondary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
            transform: scale(0);
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        .icon-wrapper svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.6s ease-out 1.2s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: rgba(37, 211, 102, 0.15);
            color: #4ade80;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1rem; }
            .celebration-card { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>
    
    <div class="celebration-card">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Selamat!</h1>
        <p>Website <strong>PT. Benang Mas Willtex</strong> telah berhasil diluncurkan, diverifikasi, dan diajukan untuk diindeks oleh sistem Google Search Console.</p>
        <div class="badge">PROYEK SELESAI</div>
    </div>

    <script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Resize canvas ketika ukuran jendela berubah
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Warna yang sesuai dengan tema (Emas, Putih Tulang, Biru Muda)
        const colors = ['#d4af37', '#fdfbf7', '#4da8da', '#e6c860', '#ffffff'];
        const particles = [];

        // Konfigurasi Partikel
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 8 + 4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.2 - 0.1;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;

                // Jika partikel jatuh melewati layar, kembalikan ke atas
                if (this.y > height) {
                    this.y = -this.size;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                // Menggambar bentuk pita
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.4);
                ctx.restore();
            }
        }

        function initConfetti() {
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        // Mulai animasi saat jendela dimuat
        window.onload = () => {
            initConfetti();
            animate();
        };
    </script>
</body>
</html>
